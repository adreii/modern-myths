# The Old Town, as data (read by lib/oldtown.py; the plan page's map draws the same numbers).
# Roblox-style plan coordinates in studs: x east, z south, so north (-z) points at the mountains.
# `face` is the way a building's front looks: N (-z), S (+z), E (+x), W (-x).
# `w` runs along the front, `d` front to back. Heights come from the terrain unless `y` is given.
# Names the EP01 shots look up (Bakery, BakerHouse, House_1..4) keep their old positions.

